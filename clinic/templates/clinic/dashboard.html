{% extends 'clinic/base.html' %}

{% block title %}Dashboard - Dr. Annops Dental Clinic{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <h2 class="mb-4">Welcome to Dr. Annops Dental Clinic</h2>
            <p class="lead mb-4">Please select your role to proceed:</p>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <a href="{% url 'patient_register' %}" class="btn btn-primary btn-lg w-100 p-4">
                        <i class="bi bi-person-check" style="font-size: 2rem;"></i><br>
                        Register as Patient
                    </a>
                </div>
                <div class="col-md-6 mb-3">
                    <a href="{% url 'doctor_register' %}" class="btn btn-primary btn-lg w-100 p-4">
                        <i class="bi bi-person-hearts" style="font-size: 2rem;"></i><br>
                        Register as Doctor
                    </a>
                </div>
            </div>

            <hr>

            <p class="text-muted">Already have an account? <a href="{% url 'login' %}">Login here</a></p>
        </div>
    </div>
</div>
{% endblock %}
